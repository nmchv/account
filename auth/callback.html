<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Авторизация nmchv</title>
    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
      
      const SUPABASE_URL = 'https://auaespbjskmbmaylnevr.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_LW6x33mJYfznN5VMzO0Qlg_bMpazVVC';
      
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      const params = new URLSearchParams(window.location.search);
      const redirectTo = params.get('redirect_to') || 'https://forms.nmchv.ru/auth/callback';
      
      async function handle() {
        const { data: { session }, error } = await supabase.auth.getSession();
        document.getElementById('status').textContent = error || !session 
          ? 'Сессия не найдена. Перенаправление на вход…' 
          : 'Сессия найдена. Возврат на формы…';
        
        if (error || !session) {
          window.location.href = '/?sso_return=' + encodeURIComponent(redirectTo);
          return;
        }
        
        // Передаём токены на forms.nmchv.ru для установки сессии там
        const formsUrl = new URL(redirectTo);
        formsUrl.searchParams.set('access_token', session.access_token);
        formsUrl.searchParams.set('refresh_token', session.refresh_token);
        
        window.location.href = formsUrl.toString();
      }
      
      handle();
    </script>
  </head>
  <body>
    <div id="status">Обработка…</div>
  </body>
</html>
